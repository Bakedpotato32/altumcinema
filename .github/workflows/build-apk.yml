name: Build AltumCinema Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Compile Vite Web Production Bundle
        run: npm run build

      - name: Add Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Copy Native MediaScanner Plugin & MainActivity
        run: |
          mkdir -p android/app/src/main/java/com/altumcinema/app/
          cp android-native/MediaScannerPlugin.java android/app/src/main/java/com/altumcinema/app/
          cp android-native/MainActivity.java android/app/src/main/java/com/altumcinema/app/

      - name: Configure Android Permissions & Legacy Storage
        run: |
          sed -i '/<application/i \
            <uses-permission android:name="android.permission.INTERNET" />\
            <uses-permission android:name="android.permission.VIBRATE" />\
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\
            <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\
            <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' android/app/src/main/AndroidManifest.xml || true

          sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/g' android/app/src/main/AndroidManifest.xml || true

      - name: Grant Execute Permissions for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compile Standalone Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltumCinema-Release-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
