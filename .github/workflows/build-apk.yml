name: Build AltumCinema Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Compile Vite Web Production Bundle
        run: npm run build

      - name: Add Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Copy Native MediaScanner Plugin & MainActivity
        run: |
          mkdir -p android/app/src/main/java/com/altumcinema/app/
          cp android-native/MediaScannerPlugin.java android/app/src/main/java/com/altumcinema/app/
          cp android-native/MainActivity.java android/app/src/main/java/com/altumcinema/app/

      - name: Generate High-Resolution Android App Icons from icon.png
        run: |
          if [ -f "icon.png" ]; then
            python3 -m pip install pillow --break-system-packages 2>/dev/null || python3 -m pip install pillow
            python3 -c "
          from PIL import Image
          import os

          img = Image.open('icon.png')
          res_dir = 'android/app/src/main/res'
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }
          for folder, size in sizes.items():
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(os.path.join(target_dir, 'ic_launcher.png'))
              resized.save(os.path.join(target_dir, 'ic_launcher_round.png'))
              resized.save(os.path.join(target_dir, 'ic_launcher_foreground.png'))
          print('Successfully generated all mipmap launcher icons!')
          "
          fi

      - name: Configure Android Permissions & Legacy Storage
        run: |
          sed -i '/<application/i \
            <uses-permission android:name="android.permission.INTERNET" />\
            <uses-permission android:name="android.permission.VIBRATE" />\
            <uses-permission android:name="android.permission.WAKE_LOCK" />\
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\
            <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' android/app/src/main/AndroidManifest.xml || true

          sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/g' android/app/src/main/AndroidManifest.xml || true

      - name: Grant Execute Permissions for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compile Standalone Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltumCinema-Release-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
